<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spilla la Birra</title>
<style>
  :root{--bg:#161f35;--panel:#2a3658;--amber:#f2a81d;--cream:#fff4d6;--mint:#3ddc97;--ink:#10172b}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  html{touch-action:manipulation}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;height:100dvh;overflow:hidden;overscroll-behavior:none}
  #wrap{position:relative;width:100%;flex:1 1 0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #top{display:none}
  canvas{display:block;border-radius:14px;touch-action:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .overlay{position:absolute;inset:0;display:flex;overflow:auto;z-index:5;background:rgba(16,23,43,.8);border-radius:14px;padding:16px}
  .overlay.hidden{display:none}
  .card{margin:auto;background:var(--panel);border-radius:18px;padding:22px 28px;max-width:520px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
  .card h1{margin:0 0 8px;font-size:clamp(22px,4vw,34px);color:var(--amber);letter-spacing:.5px}
  .card p,.card li{font-size:clamp(13px,2vw,16px);line-height:1.45;margin:6px 0;color:#dfe6f7}
  .card ul{text-align:left;padding-left:20px;margin:8px 0}
  .card.wide{max-width:600px}
  .sumhead{font-size:clamp(15px,2.6vw,19px)!important;color:#fff!important;margin:2px 0!important}
  .muted{color:#9aa8cf;font-weight:500}
  .blist{max-height:44vh;overflow:auto;text-align:left;margin:8px 0;padding-right:4px}
  .brow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brow .chip{flex:none;width:26px;height:26px;border-radius:50%}
  .binfo{flex:1;min-width:0;font-size:clamp(12px,2vw,14px);line-height:1.3}
  .binfo .sub{font-size:11px;color:#8fa0c8;margin-top:2px}
  .bscore{flex:none;text-align:right;font-size:15px}
  .bscore .stars-s{display:block;color:var(--amber);font-size:13px;letter-spacing:1px}
  .lostrow{opacity:.65}
  .carta{margin:4px 0 10px}
  .crow{display:grid;grid-template-columns:24px 74px 1fr 1fr;align-items:center;gap:8px;margin:5px 0;font-size:14px}
  .crow.dim{opacity:.5}.crow.head small{color:#8fa0c8;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .crow .chip{width:22px;height:22px;border-radius:50%}
  .cbar{display:block;height:9px;border-radius:5px;background:#3a4670;overflow:hidden}.cbar i{display:block;height:100%;border-radius:5px}
  #tuto{display:block;width:100%;max-width:440px;margin:8px auto;border-radius:14px;background:#22304f;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .helplist{text-align:left;max-height:clamp(180px,calc(100dvh - 330px),60vh);overflow:auto;padding-right:6px}
  .buy{flex:none;padding:8px 14px;font-size:15px;border-radius:12px;box-shadow:0 3px 0 #b97a0a}
  .buy:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none}
  .pips{color:var(--amber);letter-spacing:2px;font-size:12px}
  .coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:#ffd54a;box-shadow:inset 0 0 0 .14em #e0a800;vertical-align:-.1em;margin-left:.25em}
  .stars{font-size:38px;letter-spacing:6px;color:var(--amber);margin:2px 0}
  .stars .off{color:#46537a}
  table{width:100%;border-collapse:collapse;margin:8px 0;font-size:clamp(13px,2vw,15px)}
  td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
  td:last-child{text-align:right;font-weight:700}
  .pos{color:var(--mint)}.neg{color:#ff7a7a}
  button{font:inherit;font-weight:800;border:0;border-radius:14px;cursor:pointer;color:var(--ink);background:var(--amber);box-shadow:0 5px 0 #b97a0a;padding:12px 22px;letter-spacing:.5px}
  button:active,button.down{transform:translateY(4px);box-shadow:0 1px 0 #b97a0a}
  button small{display:block;font-weight:600;font-size:11px;opacity:.7}
  #ctl{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(100%,960px)}
  .grp{display:flex;align-items:center;gap:10px;background:var(--panel);padding:8px 16px;border-radius:14px;font-weight:700;font-size:14px}
  .grp input{width:min(260px,40vw);accent-color:var(--amber);height:28px}
  #tiltv{min-width:38px;text-align:right}
  .lever{position:relative;flex:none;width:64px;height:88px;background:var(--panel);border-radius:18px;touch-action:none;cursor:pointer;-webkit-touch-callout:none}
  .lever .lt{position:absolute;left:50%;top:12px;bottom:12px;width:14px;margin-left:-7px;border-radius:7px;background:#3a4670}
  .lever .lf{position:absolute;left:50%;bottom:12px;width:14px;margin-left:-7px;border-radius:7px;background:#3d9be9;height:0}
  .lever .lk{position:absolute;left:50%;bottom:-2px;width:46px;height:28px;margin-left:-23px;border-radius:12px;background:#3d9be9;border:3px solid #fff;box-shadow:0 3px 0 #226cae}
  #serve{background:var(--mint);box-shadow:0 5px 0 #1f9c6a;min-width:120px}
  #serve:active{box-shadow:0 1px 0 #1f9c6a}
  #serve{touch-action:none;-webkit-touch-callout:none}
  #serve.off{opacity:.4;box-shadow:none}
  /* ---- layout verticale (telefono) ---- */
  body.portrait{padding:6px 8px calc(8px + env(safe-area-inset-bottom));gap:8px;justify-content:flex-start}
  body.portrait #top{display:none}
  body.portrait .card{padding:14px 14px}
  body.portrait .card h1{font-size:22px}
  body.portrait .blist{max-height:clamp(110px,calc(100dvh - 560px),44vh)}
  body.portrait .card p{margin:4px 0}
  body.portrait button small{display:none}
  body.portrait #ctl{flex-direction:row;align-items:center;gap:8px;width:100%;flex-wrap:nowrap}
  body.portrait .lever{width:70px;height:96px}
  body.portrait .grp{flex:1;min-width:0;width:auto;padding:4px 12px;gap:8px;border-radius:18px;font-size:15px}
  body.portrait .grp .lbl,body.portrait #tiltv{display:none}
  body.portrait .grp input{flex:1;width:auto;min-width:0;height:56px;-webkit-appearance:none;appearance:none;background:transparent;touch-action:none}
  body.portrait .grp input::-webkit-slider-runnable-track{height:18px;border-radius:9px;background:#3a4670}
  body.portrait .grp input::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:46px;margin-top:-14px;border-radius:50%;background:var(--amber);border:4px solid #fff;box-shadow:0 4px 0 #b97a0a}
  body.portrait .grp input::-moz-range-track{height:18px;border-radius:9px;background:#3a4670}
  body.portrait .grp input::-moz-range-thumb{width:38px;height:38px;border-radius:50%;background:var(--amber);border:4px solid #fff}
  body.onefinger .grp,body.onefinger .lever{display:none}
  body.full{padding:env(safe-area-inset-top) 0 0;gap:0}
  body.full canvas{border-radius:0;box-shadow:none}
  body.full #ctl,body.full #serverow{display:none}
  body.jz #serve{display:none !important}
  body.portrait.full #serve{position:absolute;z-index:3;right:auto;bottom:auto;flex:none;width:132px;height:54px;margin:0;padding:0;font-size:22px;border-radius:16px}
  body.portrait.full #pause{position:absolute;z-index:3;width:44px;height:36px;margin:0;padding:0;font-size:16px;border-radius:12px;box-shadow:0 3px 0 #1a2340}
  #serverow{display:none}
  body.portrait #serverow{display:flex;gap:8px;width:100%;align-items:center}
  body.portrait #pause{flex:none;width:60px;height:54px;padding:0;font-size:20px;border-radius:16px}
  body.portrait #serve{flex:1;min-width:0;height:54px;padding:0;font-size:24px;border-radius:16px}
  body.portrait #serve.off{opacity:.38}
  #pause{background:var(--panel);color:#fff;box-shadow:0 5px 0 #1a2340;padding:12px 18px;font-size:20px;line-height:1}
  button.sec{background:#3a4670;color:#fff;box-shadow:0 4px 0 #1a2340;font-size:15px;padding:10px 18px;margin-top:6px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ov" class="overlay"><div class="card wide"><h1 id="ovt"></h1><div id="ovb"></div><button id="ovbtn"></button></div></div>
</div>
<div id="ctl">
  <button id="pause" title="Pausa">⏸</button>
</div>

<script>
'use strict';
/* ============================ COSTANTI ============================ */
const W = 960, H = 600;
const SX = 480, SPY = 158, MY = 272;          // x e punta del rubinetto, y del bordo del boccale
const DAY_LEN = 120;                            // durata di una giornata in secondi
const FINGER = 24;                              // 1 "dito" di schiuma = 24 px
const MAXT = 68 * Math.PI / 180;
// Tipi di birra: colore, colore schiuma, quanta schiuma fa (foamMul) e quanto resiste (decay)
const TYPES = {
  lager: { name: 'Lager',   desc: 'schiuma moderata',    beer: '#f0b52c', foam: '#fffaea', foamMul: 0.85, decay: 0.075 },
  pils:  { name: 'Pilsner', desc: 'schiuma scarsa',      beer: '#f8e27a', foam: '#fffbe8', foamMul: 0.65, decay: 0.095 },
  ipa:   { name: 'IPA',     desc: 'schiuma media',       beer: '#df8a24', foam: '#fff1d0', foamMul: 1.0,  decay: 0.070 },
  rossa: { name: 'Rossa',   desc: 'schiuma abbondante',  beer: '#b9501c', foam: '#f6dcb8', foamMul: 1.3,  decay: 0.060 },
  weiss: { name: 'Weiss',   desc: 'schiuma esuberante',  beer: '#e6c177', foam: '#fffaf0', foamMul: 1.7,  decay: 0.085 },
  stout: { name: 'Stout',   desc: 'schiuma cremosa',     beer: '#26140f', foam: '#d8b48a', foamMul: 1.3,  decay: 0.025 }
};
let BEER = TYPES.lager.beer, FOAM = TYPES.lager.foam, curType = TYPES.lager;

for (const k in TYPES) TYPES[k].key = k;

// Un boccale per ogni tipo di birra. Profilo = [y, semi-larghezza] dall'alto al basso (coordinate locali, y verso il basso).
const GLASS_DEFS = {
  lager: { prof: [[-115, 55], [112, 50]], handle: false },                                // cilindro classico, dritto
  ipa:   { prof: [[-112, 66], [0, 57], [108, 47]], handle: false },                       // pinta classica, senza manico
  pils:  { prof: [[-140, 47], [130, 19]], handle: false },                                // alto e conico, base stretta
  weiss: { prof: [[-140, 44], [-104, 55], [-40, 50], [50, 34], [130, 27]], handle: false },// alto e snello, a vaso
  rossa: { prof: [[-110, 69], [106, 51]], handle: true },                                 // boccale con manico
  stout: { prof: [[-110, 60], [-60, 67], [10, 58], [108, 44]], handle: false }            // pinta con pancia
};
const TRAY_Y = 496;                               // il fondo del boccale poggia sulla vaschetta
function buildGlass(key){
  const d = GLASS_DEFS[key], p = d.prof, n = p.length;
  const inn = [[-p[0][1], p[0][0]], [p[0][1], p[0][0]]], out = [[-p[0][1] - 6, p[0][0] - 3], [p[0][1] + 6, p[0][0] - 3]];
  for (let i = 1; i < n; i++){ const y = p[i][0] + (i === n-1 ? 0 : 0); inn.push([p[i][1], y]); out.push([p[i][1] + 6, i === n-1 ? y + 8 : y]); }
  for (let i = n-1; i >= 1; i--){ inn.push([-p[i][1], p[i][0]]); out.push([-p[i][1] - 6, i === n-1 ? p[i][0] + 8 : p[i][0]]); }
  const top = p[0][0], bot = p[n-1][0], botOut = bot + 8;
  const hwAt = y => {
    if (y <= p[0][0]) return p[0][1];
    for (let i = 1; i < n; i++) if (y <= p[i][0]){ const t = (y - p[i-1][0]) / (p[i][0] - p[i-1][0]); return p[i-1][1] + (p[i][1] - p[i-1][1])*t; }
    return p[n-1][1];
  };
  return { key, inn, out, top, bot, botOut, wt: p[0][1], wmax: Math.max(...p.map(q => q[1])), handle: d.handle, prof: p, hwAt,
           cap: area(inn), my: TRAY_Y + top - botOut };
}
let VIS_R = 742;                                  // x massima visibile nel mondo: il boccale non deve uscire dallo schermo
// inclinazione massima: il boccale (manico compreso) deve restare nella zona visibile anche nella vista verticale
function maxTiltFor(g){
  const pts = g.out.concat(g.handle ? [[110, -60], [110, 40]] : []);
  for (let th = MAXT; th > 0.5; th -= 0.01){
    const k = Math.min(1, th/0.87), sm = k*k*(3 - 2*k), u = -(g.wt - 19)*sm, c = Math.cos(th), s = Math.sin(th);
    const cx = SX - (u*c + g.top*s);
    if (Math.max(...pts.map(p => cx + p[0]*c + p[1]*s)) <= VIS_R) return th;
  }
  return 0.5;
}
const GLASSES = {}; for (const k in GLASS_DEFS){ GLASSES[k] = buildGlass(k); GLASSES[k].maxT = maxTiltFor(GLASSES[k]); }
const QREF = 25900;                               // capacità di riferimento: ogni boccale si riempie nello stesso tempo
let G = GLASSES.lager, INN = G.inn, OUT = G.out, CAP_UP = G.cap;

/* ============================ GEOMETRIA ============================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function area(p){ let a = 0; for (let i = 0; i < p.length; i++){ const q = p[(i+1)%p.length]; a += p[i][0]*q[1] - q[0]*p[i][1]; } return Math.abs(a)/2; }

// tiene la parte sotto (y >= Y) oppure sopra (y <= Y) della linea orizzontale
function clip(p, y, below){
  const out = [];
  for (let i = 0; i < p.length; i++){
    const a = p[i], b = p[(i+1)%p.length];
    const ia = below ? a[1] >= y : a[1] <= y, ib = below ? b[1] >= y : b[1] <= y;
    if (ia) out.push(a);
    if (ia !== ib){ const t = (y - a[1])/(b[1] - a[1]); out.push([a[0] + (b[0]-a[0])*t, y]); }
  }
  return out;
}
// y del pelo libero per un dato volume (area) nel poligono
function levelFor(poly, vol){
  let lo = Infinity, hi = -Infinity;
  for (const q of poly){ lo = Math.min(lo, q[1]); hi = Math.max(hi, q[1]); }
  if (vol <= 0) return hi;
  if (vol >= area(poly)) return lo;
  for (let i = 0; i < 22; i++){ const m = (lo+hi)/2; if (area(clip(poly, m, true)) > vol) lo = m; else hi = m; }
  return (lo+hi)/2;
}
function xf(p, th, cx, cy){ const c = Math.cos(th), s = Math.sin(th); return [cx + p[0]*c + p[1]*s, cy - p[0]*s + p[1]*c]; }
function toLocal(x, y, g){ const dx = x - g.cx, dy = y - g.cy, c = Math.cos(g.th), s = Math.sin(g.th); return [dx*c - dy*s, dx*s + dy*c]; }
function pip(poly, x, y){
  let r = false;
  for (let i = 0, j = poly.length-1; i < poly.length; j = i++){
    const a = poly[i], b = poly[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1]) + a[0]) r = !r;
  }
  return r;
}
// Posizione del boccale: il getto cade al centro da dritto e verso il bordo interno quando è inclinato
function geom(th){
  const k = Math.min(1, th/0.87), sm = k*k*(3-2*k), u = -(G.wt - 19)*sm;
  const c = Math.cos(th), s = Math.sin(th);
  const cx = SX - (u*c + G.top*s), cy = G.my - (-u*s + G.top*c);
  const ip = INN.map(p => xf(p, th, cx, cy)), op = OUT.map(p => xf(p, th, cx, cy));
  const low = ip[0][1] > ip[1][1] ? ip[0] : ip[1];           // punto più basso del bordo: da qui trabocca
  const cap = area(clip(ip, low[1], true));
  return { th, cx, cy, ip, op, low, cap };
}
// Il getto verticale: dove atterra e come?
function computeStream(g, yT){
  let inside = false;
  for (let y = SPY; y < 540; y += 2){
    const ins = pip(g.ip, SX, y);
    if (!inside){
      if (ins){ const l = toLocal(SX, y, g); if (l[1] > G.top + 22) return { y1: y, kind: 'none' }; inside = true; }
      continue;
    }
    if (!ins){ const l = toLocal(SX, y-2, g); return { y1: y-2, kind: l[1] > G.bot - 10 ? 'bottom' : 'wall' }; }
    if (y >= yT) return { y1: y, kind: 'surface' };
  }
  return { y1: 520, kind: 'none' };
}
// Misure "a boccale dritto" (quelle usate per il punteggio)
function metrics(){
  const yb = levelFor(INN, beer), yt = levelFor(INN, beer + foam);
  return { foamH: yb - yt, gap: Math.max(0, yt - G.top) };
}

/* ============================ STATO ============================ */
let mode = 'menu';          // menu | playing | paused | summary | over
let beer = 0, foam = 0, spill = 0, puddle = 0, tilt = 0, tiltT = 0, flow = 0, serveTimer = 0;
let time = 0, gameTime = 0;
let stream = null, hint = '';
let joyX = 0, joyRX = 0, joyRY = 0;                                   // joystick fisso a T: spostamento (con zona morta) e grezzo
let touching = false, fingerV = 0;                                    // dito/mouse sul joystick e livello di flusso (0..1)
let parts = [], bub = [];
let last = null;
let glassType = null;                       // tipo di birra nel boccale (segue il cliente in testa alla fila)
let customers = [], sel = null, nextCustId = 1, spawnTimer = 0;
let score = 0, served = 0, lives = 3;        // score = monete guadagnate in totale (record), wallet = monete spendibili
let wallet = 0, ups = {};                       // potenziamenti acquistati: id -> livello
const lvl = id => ups[id] || 0;
const UPGRADES = [
  { id: 'ice',   name: 'Boccale ghiacciato',      desc: 'La schiuma collassa più lentamente', max: 3, price: [40, 70, 110],  fx: ['collasso −20%', 'collasso −40%', 'collasso −60%'] },
  { id: 'prec',  name: 'Rubinetto di precisione', desc: 'Il getto dritto fa meno schiuma',    max: 3, price: [50, 85, 130],  fx: ['−12% schiuma', '−24% schiuma', '−36% schiuma'] },
  { id: 'flow',  name: 'Rubinetto potenziato',    desc: 'Flusso più veloce, spilli prima',    max: 3, price: [40, 70, 110],  fx: ['+15% flusso', '+30% flusso', '+45% flusso'] },
  { id: 'pat',   name: 'Clienti pazienti',        desc: 'I clienti aspettano di più',         max: 3, price: [45, 80, 120],  fx: ['+10% attesa', '+20% attesa', '+30% attesa'] },
  { id: 'waste', name: 'Antispreco',              desc: 'Penalità ridotte per la birra sprecata', max: 3, price: [35, 60, 95], fx: ['−25% penalità', '−50% penalità', '−75% penalità'] },
  { id: 'hours', name: 'Orario prolungato',       desc: 'La giornata dura di più',            max: 3, price: [60, 100, 150], fx: ['+20 secondi', '+40 secondi', '+60 secondi'] },
  { id: 'life',  name: 'Vita extra',              desc: 'Più margine di errore',              max: 1, price: [90],           fx: ['4 vite a giornata'] },
  { id: 'meter', name: 'Schiumometro',            desc: 'Schiuma e riempimento anche su telefono', max: 1, price: [70],      fx: ['pannello sempre visibile'], only: () => !LAND }
];
let day = 1, dayTimeLeft = DAY_LEN, closing = false, dayLog = [], dayNotes = [];   // giornata corrente: tempo rimasto, chiusura, registro delle birre
let toast = null, shake = 0, wipe = 0, fx = [];
let PZ = 1.25, PX0 = 365;                       // vista verticale: zoom e angolo sinistro della scena nel mondo
let PY0 = 112;
const PSY = 178;                                 // altezza della fascia dei clienti in alto (telefono)                      // y mondo in alto nella scena, y canvas dove inizia la scena
let glassEnter = 0, glassHold = 0;             // 1 -> 0: il nuovo boccale vuoto entra da sinistra, dopo una breve pausa (glassHold, secondi)
let slideActive = false, slideX0 = 0, slideOff = 0;        // servire = trascinare il boccale verso destra (scivola con il dito)
const SLIDE_DIST = 190;                        // distanza di trascinamento (unità di scena) per consegnare
const JZ = true;                                 // il joystick è sempre fisso in un'area riservata
let serveAnim = 0, serveRect = null;
const JZ_H = 210;                                // altezza dell'area riservata al joystick
const JZ_RX = Math.round((480 - 56 - 74) * 2 / 3);               // barra dell'inclinazione: un terzo più corta
const jzGeom = () => LAND ? { ax: 712, ay: CH - 120, rx: 180, ry: 60 }                                   // desktop: in basso a destra
                          : { ax: Math.round((CW - JZ_RX) / 2), ay: CH - JZ_H + 66, rx: JZ_RX, ry: 108 };   // telefono: T centrata nell'area in basso
let FULL = false;                                // telefono: schermata a tutta altezza
let LAND = true, CW = 960, CH = 600;      // layout orizzontale (PC) o verticale (telefono)

/* ============================ CLIENTI ============================ */
const TYPE_ORDER = ['lager', 'ipa', 'pils', 'weiss', 'rossa', 'stout'];
const FINGER_CHOICES = [1, 1.5, 2, 2.5, 3];
const SLOT_X = 772, SLOT_W = 172, SLOT_H = 98, SLOT_GAP = 6, SLOT_Y0 = 14;
const slotRect = i => LAND ? { x: SLOT_X, y: SLOT_Y0 + i*(SLOT_H + SLOT_GAP), w: SLOT_W, h: SLOT_H }
                            : { x: 8 + i*118, y: 14, w: 111, h: 112 };
const unlockedFor   = d => Math.min(TYPE_ORDER.length, d);            // una birra in più ogni giornata
const seatsFor      = d => Math.min(4, 2 + Math.max(0, d - 2));       // un posto in più ogni giornata, ma a partire dalla terza
const unlockedCount = () => unlockedFor(day);
const seatCount     = () => seatsFor(day);
const patienceFor   = () => Math.max(55, 90 - served*0.6) * (1 + 0.1*lvl('pat'));
const spawnGap      = () => Math.max(10, 22 - served*0.4);
const minQueue      = () => Math.min(seatCount(), 1 + Math.floor(served/6));   // clienti in attesa che il bar cerca di avere sempre
const timeStr       = t => `${Math.floor(Math.ceil(t)/60)}:${String(Math.ceil(t)%60).padStart(2, '0')}`;
const fmt = v => v.toFixed(1).replace('.', ',');
const pick = a => a[Math.floor(Math.random()*a.length)];
const SKINS = ['#f3c9a0', '#e0a878', '#c68a5a', '#8d5a3a', '#f7d9bd'];
const HAIRS = ['#2b1b14', '#6b3a1d', '#c9a24a', '#a0a0a8', '#d9531e', '#1b1b1b'];
const COLORS = ['#3d9be9', '#e0564f', '#3ddc97', '#8e6bd8', '#f2a81d'];
function randomFace(){
  return { skin: pick(SKINS), hair: pick(HAIRS), style: Math.floor(Math.random()*4), beard: Math.random() < .35,
           glasses: Math.random() < .3, hat: Math.random() < .2 ? pick(COLORS) : null, shirt: pick(COLORS) };
}
const selCust = () => customers.find(c => c.id === sel && c.state === 'waiting') || null;
function flash(msg){ toast = { text: msg, t: 2.4 }; }

function spawnCustomer(){
  const seats = seatCount(), taken = new Set(customers.map(c => c.slot)), free = [];
  for (let i = 0; i < seats; i++) if (!taken.has(i)) free.push(i);
  if (!free.length) return false;
  const n = unlockedCount(), pool = [];
  for (let i = 0; i < n; i++){ const w = (i === n-1 && n > 1) ? 3 : 2; for (let k = 0; k < w; k++) pool.push(TYPE_ORDER[i]); }
  const pat = patienceFor();
  customers.push({ id: nextCustId++, slot: pick(free), type: pick(pool), fingers: pick(FINGER_CHOICES), face: randomFace(),
                   max: pat, t: pat, state: 'waiting', leave: 0, popup: null });
  return true;
}
function startClosing(){
  closing = true; flash('Ultimi clienti: si chiude!');
  for (const c of customers) if (c.state === 'waiting') c.t = Math.min(c.t, 20);
}
function updateCustomers(dt){
  if (dayTimeLeft > 0){ dayTimeLeft -= dt; if (dayTimeLeft <= 0){ dayTimeLeft = 0; startClosing(); } }
  for (const c of customers){
    if (c.state === 'waiting'){
      c.t -= dt;
      if (c.t <= 0){
        c.state = 'gone'; c.leave = 2; c.popup = { text: 'Me ne vado!' };
        if (!closing) lives--;            // a chiusura chi se ne va non costa una vita
        shake = .4; ding(false);
        dayLog.push({ type: c.type, fingers: c.fingers, lost: true, score: 0, stars: 0 });
        if (sel === c.id) sel = null;
        if (lives <= 0 && !closing){ endGame(); return; }
      }
    } else c.leave -= dt;
  }
  customers = customers.filter(c => c.state === 'waiting' || c.leave > 0);
  spawnTimer -= dt;
  if (!closing){
    // niente tempi morti: se in sala ci sono pochi clienti, il prossimo arriva in fretta
    if (customers.filter(c => c.state === 'waiting').length < minQueue() && spawnTimer > 1.5) spawnTimer = 1.5;
    if (spawnTimer <= 0) spawnTimer = spawnCustomer() ? spawnGap() * (0.7 + Math.random()*0.6) : 1;
  }
  // ordine FIFO: si serve sempre il cliente arrivato per primo tra quelli in attesa
  const first = customers.filter(c => c.state === 'waiting').sort((a, b) => a.id - b.id)[0];
  sel = first ? first.id : null;
  if (closing && customers.length === 0) endDay();       // tempo scaduto e sala vuota: fine giornata
}

function emptyGlass(toPuddle){
  if (toPuddle) puddle += (beer + foam) * 0.5;
  beer = foam = spill = 0; glassType = null; tilt = tiltT = flow = 0; stream = null; bub = [];
  try { pourEl.currentTime = 0; } catch(e){}      // nuova birra: il suono riparte dall'inizio
  mode = 'playing';
}
const SERVE_MIN = 0.95;                        // riempimento minimo per poter servire
const fillFrac = () => (beer + foam) / CAP_UP;
const canServe = () => mode === 'playing' && !!selCust() && fillFrac() >= SERVE_MIN;
function setGlass(key){                           // cambia boccale mantenendo la stessa percentuale di riempimento
  const n = GLASSES[key]; if (n === G) return;
  const r = n.cap / G.cap; beer *= r; foam *= r; spill *= r; bub = [];
  G = n; INN = n.inn; OUT = n.out; CAP_UP = n.cap;
}
function judge(c){
  const target = c.fingers * FINGER, m = metrics();
  const foamPts = Math.max(0, 60 * (1 - Math.abs(m.foamH - target)/45));
  const fillPts = Math.max(0, 30 * (1 - m.gap/60));
  const speedPts = 10 * clamp(c.t/c.max, 0, 1) * (fillPts/30);
  const spillPts = Math.min(15, spill / CAP_UP * 100 * 0.8) * (1 - 0.25*lvl('waste'));
  const s = Math.round(clamp(foamPts + fillPts + speedPts - spillPts, 0, 100));
  // monete: da 0 a 10 per birra (componenti: schiuma max 6, riempimento max 3, velocità max 1, sprechi fino a −1,5)
  return { score: Math.round(s/10), stars: s >= 85 ? 3 : s >= 60 ? 2 : s >= 30 ? 1 : 0, foamH: m.foamH, target, gap: m.gap,
           foamPts: foamPts/10, fillPts: fillPts/10, speedPts: speedPts/10, spillPts: spillPts/10, wait: c.max - c.t };
}
function deliver(c){
  const r = judge(c);
  score += r.score; wallet += r.score; served++;
  c.state = r.score >= 6 ? 'happy' : r.score >= 3 ? 'meh' : 'angry';
  c.leave = 2.6; c.popup = r;
  if (sel === c.id) sel = null;
  ding(r.stars > 0, r.stars);
  wipe = .8;                       // il barista passa lo straccio: la birra caduta sparisce
  celebrate(c, r.stars);
  dayLog.push({ type: c.type, fingers: c.fingers, lost: false, ...r });
  emptyGlass(false); glassEnter = 1; glassHold = 0.5;   // il nuovo boccale vuoto entra da sinistra dopo mezzo secondo
}
function newGame(){ score = 0; wallet = 0; ups = {}; served = 0; day = 1; startDay(); }
function startDay(){
  dayTimeLeft = DAY_LEN + 20*lvl('hours'); closing = false; dayLog = []; dayNotes = [];
  lives = 3 + lvl('life'); gameTime = 0; customers = []; sel = null; spawnTimer = 0.8; puddle = 0; wipe = 0; toast = null; parts = []; fx = [];
  emptyGlass(false); glassEnter = 1; glassHold = 0.1; hideOverlay();

/* ============================ AUDIO ============================ */
let ac = null, clickBuf, muted = false, wasOpen = false;
// suono della birra che scende nel bicchiere (file audio): in loop, volume legato al flusso
const pourEl = new Audio('audio/beer-pour.mp3');
pourEl.loop = true; pourEl.preload = 'auto';
function audioInit(){
  // sblocca la riproduzione audio con il primo click dell'utente
  pourEl.volume = 0; pourEl.play().then(() => pourEl.pause()).catch(() => {});
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    clickBuf = ac.createBuffer(1, Math.floor(ac.sampleRate*.04), ac.sampleRate);
    const cd = clickBuf.getChannelData(0); for (let i = 0; i < cd.length; i++) cd[i] = (Math.random()*2 - 1) * (1 - i/cd.length);
  } catch(e){ ac = null; }
}
// level 0..1 = apertura del rubinetto; kind = dove cade il getto (sul bordo è più morbido)
function pourSound(level, kind){
  const v = muted ? 0 : clamp(level * (kind === 'wall' ? 0.65 : 1), 0, 1);
  pourEl.volume = v;
  if (v > 0.02){ if (pourEl.paused) pourEl.play().catch(() => {}); }   // dentro la stessa birra riprende da dove si era fermato
  else if (!pourEl.paused) pourEl.pause();
}
// "clac" della valvola quando si apre o si chiude il rubinetto
function clack(open){
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(open ? 170 : 120, t); o.frequency.exponentialRampToValueAtTime(45, t + .09);
  g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .12);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .13);
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), ng = ac.createGain();
  n.buffer = clickBuf; f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 1; ng.gain.value = open ? .25 : .18;
  n.connect(f); f.connect(ng); ng.connect(ac.destination); n.start(t);
}
function ding(good, stars){
  if (!ac || muted) return;
  const t = ac.currentTime;
  (good ? (stars >= 3 ? [660, 880, 1320, 1760] : stars === 2 ? [660, 880, 1320] : [660, 880]) : [300, 220]).forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = good ? 'sine' : 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t + i*.11); g.gain.linearRampToValueAtTime(.12, t + i*.11 + .02); g.gain.exponentialRampToValueAtTime(.001, t + i*.11 + .5);
    o.connect(g); g.connect(ac.destination); o.start(t + i*.11); o.stop(t + i*.11 + .55);
  });
}

/* ============================ LOGICA ============================ */
function update(dt){
  puddle = Math.max(0, puddle - puddle*(wipe > 0 ? 5 : 0.02)*dt); wipe = Math.max(0, wipe - dt);
  updateFx(dt);
  shake = Math.max(0, shake - dt);
  if (glassHold > 0) glassHold -= dt; else glassEnter = Math.max(0, glassEnter - dt/0.42);   // mezzo secondo di attesa, poi il boccale entra
  serveAnim = clamp(serveAnim + ((JZ && canServe() && tilt < 0.15) ? 6 : -6)*dt, 0, 1);       // il fumetto SERVI spunta quando la birra è servibile
  if (toast){ toast.t -= dt; if (toast.t <= 0) toast = null; }
  const active = mode === 'playing';
  if (!active){
    flow = Math.max(0, flow - 6*dt);
    pourSound(0, '', 0);
    updateParticles(dt);
    return;
  }
  gameTime += dt;
  updateCustomers(dt);
  if (mode === 'over' || mode === 'summary'){ updateParticles(dt); return; }

  const playing = mode === 'playing';
  // joystick fisso (T): a destra si inclina il boccale, in basso aumenta il flusso; senza dito/mouse il boccale torna dritto
  tiltT = playing && touching ? clamp(joyX * G.maxT, 0, G.maxT) : 0;
  tilt += (tiltT - tilt) * (1 - Math.exp(-dt*9));

  // quale birra? Si decide al primo getto in base al cliente selezionato
  const sc = selCust();
  let target = playing && touching && fingerV >= 0.03 ? 0.05 + 0.95*Math.pow(fingerV, 1.4) : 0;
  // il tipo di birra segue il cliente in testa alla fila: se quello che stavi servendo se ne va,
  // la birra nel boccale resta e viene servita al prossimo (che ne cambia il tipo)
  if (sc){
    if (glassType && glassType !== sc.type && beer + foam > 50) flash(`Cambio ordine: ora serve una ${TYPES[sc.type].name}`);
    glassType = sc.type;
  }
  if (target > 0 && !glassType) target = 0;
  if (glassEnter > 0) target = 0;                       // finché il boccale sta entrando non si versa
  const gKey = glassType || (sc ? sc.type : 'lager');
  curType = TYPES[gKey]; BEER = curType.beer; FOAM = curType.foam; setGlass(gKey);
  flow = clamp(flow + clamp(target - flow, -8*dt, 6*dt), 0, 1);
  const isOpen = flow > 0.05;
  if (isOpen !== wasOpen){ clack(isOpen); wasOpen = isOpen; }

  const g = geom(tilt);
  const yT = levelFor(g.ip, beer + foam);
  stream = null;
  if (flow > 0.03){
    stream = computeStream(g, yT);
    const q = flow * 4300 * (CAP_UP / QREF) * (1 + 0.15*lvl('flow')) * dt;
    if (stream.kind === 'none'){ spill += q; puddle += q; }
    else {
      // più il flusso è basso, meno schiuma si forma (soprattutto col getto dritto)
      let f = stream.kind === 'wall' ? 0.05 + 0.15*flow : stream.kind === 'surface' ? 0.12 + 0.58*flow : 0.20 + 0.60*flow;
      f = clamp(f * curType.foamMul * (stream.kind === 'wall' ? 1 : 1 - 0.12*lvl('prec')), 0.02, 0.92);
      foam += q*f; beer += q*(1-f);
    }
    if (stream.kind !== 'none' && Math.random() < .8){
      parts.push({ x: SX + (Math.random()-.5)*8, y: stream.y1, vx: (Math.random()-.5)*120, vy: -60 - Math.random()*120,
                   r: 1.5 + Math.random()*2, c: stream.kind === 'surface' && foam > 200 ? FOAM : BEER, life: .5 });
    }
  }
  // la schiuma collassa lentamente in birra
  const dcy = foam * curType.decay * (1 - 0.2*lvl('ice')) * dt; foam -= dcy; beer += dcy * 0.55;

  // traboccamento
  const tot = beer + foam;
  if (tot > g.cap){
    const ex = tot - g.cap, fx = Math.min(foam, ex);
    foam -= fx; beer -= (ex - fx); spill += ex; puddle += ex;
    for (let i = 0; i < 2; i++) parts.push({ x: g.low[0] + (Math.random()-.5)*6, y: g.low[1], vx: -30 - Math.random()*40, vy: 20,
                                           r: 2 + Math.random()*3, c: fx > 0 ? FOAM : BEER, life: 2 });
  }
  beer = Math.max(0, beer); foam = Math.max(0, foam);
  if (slideActive && !selCust()) slideActive = false;       // il cliente se n'è andato: gesto annullato
  if (!slideActive) slideOff *= Math.exp(-dt*9);              // se lasci prima della fine, il boccale torna al suo posto
  if (slideOff < 0.5 && !slideActive) slideOff = 0;

  // bollicine nella birra
  if (beer > 800 && bub.length < 40 && Math.random() < 14*dt){
    const ly = G.bot - 45 + Math.random()*40, lx = (Math.random()-.5)*G.hwAt(ly)*1.4, w = xf([lx, ly], tilt, g.cx, g.cy);
    if (w[1] > levelFor(g.ip, beer) + 10) bub.push({ x: lx, y: ly, r: 1.5 + Math.random()*2.2, v: 25 + Math.random()*30, ph: Math.random()*6 });
  }
  const yB = levelFor(g.ip, beer);
  for (let i = bub.length-1; i >= 0; i--){
    const b = bub[i]; b.y -= b.v*dt; b.x += Math.sin(time*4 + b.ph)*10*dt;
    const w = xf([b.x, b.y], tilt, g.cx, g.cy);
    if (w[1] < yB + 3 || b.y < G.top + 5) bub.splice(i, 1);
  }
  updateParticles(dt);

  // consiglio

  }
  fx.push({ t: 'text', x: Math.min(Math.max(cx, 110), CW - 110), y: cy + 6, vy: -55, life: 1.5, max: 1.5, text: big ? 'PERFETTO!' : 'Ottimo!',
            col: big ? '#ffd54a' : '#7ee2c3', size: big ? 30 : 24 });

function updateFx(dt){
  for (let i = fx.length - 1; i >= 0; i--){
    const p = fx[i];
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.life -= dt;
    if (p.life <= 0){ fx.splice(i, 1); continue; }
    if (p.t === 'conf' || p.t === 'star'){ p.vy += p.g*dt; p.vx *= (1 - .6*dt); p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; }
    else if (p.t === 'text') p.y += p.vy*dt;
  }
}
function starPath(R){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI/2 + i*Math.PI/5, r = i % 2 ? R*.45 : R; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  ctx.closePath();
}
function drawFx(){
  for (const p of fx){
    if (p.delay > 0) continue;
    const k = 1 - p.life/p.max, fade = clamp(p.life/.4, 0, 1);
    ctx.save();
    if (p.t === 'flash'){
      ctx.fillStyle = `rgba(255,213,74,${(1 - k)*.5})`; rr(p.x, p.y, p.w, p.h, 14); ctx.fill();
    } else if (p.t === 'ring'){
      ctx.strokeStyle = `rgba(255,213,74,${1 - k})`; ctx.lineWidth = 7*(1 - k) + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*Math.sqrt(k), 0, 7); ctx.stroke();
    } else if (p.t === 'conf'){
      ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    } else if (p.t === 'star'){
      ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const sc = 1 + .25*Math.sin(p.life*14); ctx.scale(sc, sc);
      ctx.fillStyle = '#ffd54a'; starPath(p.size); ctx.fill();
      ctx.strokeStyle = '#fff6c9'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (p.t === 'text'){
      const pop = Math.min(1, k*7), sc = pop < 1 ? .4 + 1.3*pop : 1.7 - .7*Math.min(1, (k - .14)*8);
      ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.scale(clamp(sc, .4, 1.7)*.8 + .2, clamp(sc, .4, 1.7)*.8 + .2);
      ctx.font = `900 ${p.size}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = '#10172b'; ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.col; ctx.fillText(p.text, 0, 0);
    }
    ctx.restore();
  }
}

function setJoystick(e){                             // joystick fisso (T): il cursore segue dito/mouse; giù = flusso, destra = inclinazione
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * CW / r.width, y = (e.clientY - r.top) * CH / r.height, g = jzGeom();

cv.addEventListener('pointerdown', e => {
  audioInit();

  const cap = () => { try { cv.setPointerCapture(e.pointerId); } catch(err){} };
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * CW / r.width, py = (e.clientY - r.top) * CH / r.height;
  const onBubble = serveRect && px >= serveRect.x - 8 && px <= serveRect.x + serveRect.w + 8 && py >= serveRect.y - 8 && py <= serveRect.y + serveRect.h + 8;
  const onGlass = px >= wx(480 - G.wmax - 10) && px <= wx(480 + G.wmax + (G.handle ? 64 : 0) + 10) && py >= wy(G.my) - 12 && py <= wy(TRAY_Y) + 6;
  if (serveAnim > 0.6 && !slideActive && (onBubble || onGlass)){        // inizia lo slide: trascina la birra verso destra
    slideActive = true; slideX0 = px; slideOff = 0; cap(); return;
  }
  if (inJoyZone(px, py)){ touching = true; setJoystick(e); cap(); }     // il resto dello schermo non risponde
});
function slideMove(e){                              // il boccale segue il dito verso destra: raggiunta la distanza, la birra viene consegnata
  const r = cv.getBoundingClientRect(), px = (e.clientX - r.left) * CW / r.width;
  slideOff = Math.max(0, px - slideX0);

    slideActive = false; slideOff = 0;
    const c = selCust(); if (c) deliver(c);
  }
}

/* ============================ TUTORIAL ANIMATO (popup iniziale) ============================ */
const TUT_P = [[-40, 0], [40, 0], [30, 125], [-30, 125]];       // boccale del tutorial (coordinate locali)
const smooth01 = (a, b, t) => { const k = Math.max(0, Math.min(1, (t - a)/(b - a))); return k*k*(3 - 2*k); };
function tutInput(t){                                           // dito virtuale: destra = inclina, giù = flusso
  if (t < 1.0 || t >= 8.2) return { on: false, rx: 0, ry: 0 };
  return { on: true,
    rx: 0.75*smooth01(1.0, 2.2, t) - 0.65*smooth01(5.4, 6.8, t),
    ry: 0.38*smooth01(2.0, 3.0, t) + 0.45*smooth01(3.0, 6.0, t) + 0.10*smooth01(6.2, 8.0, t) };
}
let TUT_END = null;
function tutRaw(tt){                                            // simulazione grezza: dopo 8.2 s i volumi restano fermi, solo il boccale si raddrizza
  let beer = 0, foam = 0, tl = 0; const dt = 0.05;
  for (let t = 0; t < tt; t += dt){
    const k = tutInput(t), fl = k.ry > 0.03 ? 0.05 + 0.95*Math.pow(k.ry, 1.4) : 0;
    tl += (k.rx*0.8 - tl) * Math.min(1, dt*9);
    if (t >= 8.2) continue;
    const q = fl*0.21*dt, f = tl > 0.45 ? 0.10 + 0.10*fl : 0.25 + 0.55*fl;
    beer += q*(1 - f); foam += q*f; const d = foam*0.05*dt; foam -= d; beer += d*0.5;
  }
  return { beer, foam, tl };
}
function tutState(tt){
  const e = TUT_END || (TUT_END = tutRaw(8.2)), r = tutRaw(tt), k = tutInput(tt);
  const fl = k.ry > 0.03 ? 0.05 + 0.95*Math.pow(k.ry, 1.4) : 0;
  // a fine versata il boccale è pieno fino all'orlo: la birra arriva al tratteggio (y = 30) e sopra c'è la schiuma
  return { beer: r.beer * 0.734 / e.beer, foam: r.foam * 0.266 / e.foam, tilt: r.tl, flow: fl, on: k.on, rx: k.rx, ry: k.ry };
}
function drawTutorial(tc){
  const c = tc.getContext('2d'), W = tc.width, H = tc.height, t = time % 12, S = tutState(t);
  const rr2 = (x, y, w, h, r) => { c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); };
  const poly2 = p => { c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); };
  c.save(); c.clearRect(0, 0, W, H);
  c.fillStyle = '#22304f'; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,.04)'; for (let x = 0; x < W; x += 88) c.fillRect(x, 0, 44, H);
  c.fillStyle = '#7a4b2a'; c.fillRect(0, 196, W, H - 196); c.fillStyle = '#a86b3c'; c.fillRect(0, 196, W, 8);
  c.fillStyle = '#8e96aa'; c.beginPath(); c.moveTo(108, 0); c.lineTo(132, 0); c.lineTo(127, 24); c.lineTo(113, 24); c.fill(); c.fillStyle = '#6f7790'; c.fillRect(112, 22, 16, 6);

  // boccale
  const k = Math.min(1, S.tilt/0.8), sm = k*k*(3 - 2*k), u = -24*sm, cs = Math.cos(S.tilt), sn = Math.sin(S.tilt);
  const slideT = t >= 8.8 ? 115*smooth01(8.8, 10.8, t) : 0;       // il boccale scivola verso destra insieme al dito
  const ox = 120 - u*cs + slideT, oy = 60 + u*sn, ip = TUT_P.map(p => xf(p, S.tilt, ox, oy)), A = area(TUT_P);
  const yB = levelFor(ip, S.beer*A), yT = levelFor(ip, (S.beer + S.foam)*A);
  if (S.beer*A > 30){ c.fillStyle = '#f0b52c'; poly2(clip(ip, yB, true)); c.fill(); }
  if (S.foam*A > 30){
    const fp = clip(clip(ip, yT, true), yB, false);
    if (fp.length > 2){
      c.fillStyle = '#fffaea'; poly2(fp); c.fill();
      const xs = fp.filter(p => Math.abs(p[1] - yT) < 0.6).map(p => p[0]);
      if (xs.length >= 2){ const x0 = Math.min(...xs) + 4, x1 = Math.max(...xs) - 4, n = Math.max(2, Math.round((x1 - x0)/11)); for (let i = 0; i <= n; i++){ c.beginPath(); c.arc(x0 + (x1 - x0)*i/n, yT + 3, 5 + (i*37)%3, 0, 7); c.fill(); } }
    }
  }
  if (S.flow > 0.03){                                           // getto
    let inside = false, end = 196;
    for (let y = 28; y < 196; y += 2){ const ins = pip(ip, 120, y); if (!inside && ins) inside = true; if (inside && (!ins || y >= yT)){ end = y; break; } }
    const w = 2 + 7*S.flow; c.fillStyle = '#f0b52c'; c.fillRect(120 - w/2, 24, w, end - 24);
  }
  c.save(); c.translate(ox, oy); c.rotate(-S.tilt);               // vetro e linea guida
  c.fillStyle = 'rgba(190,225,255,.14)'; poly2(TUT_P); c.fill();
  c.strokeStyle = 'rgba(220,240,255,.85)'; c.lineWidth = 4; c.lineJoin = 'round'; c.lineCap = 'round';
  c.beginPath(); c.moveTo(40, 0); c.lineTo(30, 125); c.lineTo(-30, 125); c.lineTo(-40, 0); c.stroke();
  c.setLineDash([6, 5]); c.strokeStyle = 'rgba(16,23,43,.55)'; c.lineWidth = 4; c.beginPath(); c.moveTo(-36, 30); c.lineTo(36, 30); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-36, 30); c.lineTo(36, 30); c.stroke(); c.setLineDash([]);
  c.restore();
  if (t >= 8.2 && t < 8.4){                                     // a fine versata: schiuma fino all'orlo, birra fino al tratteggio
    c.font = '800 11px system-ui,sans-serif'; c.textAlign = 'left'; c.fillStyle = '#fffaea'; c.fillText('◀ schiuma', 170, 78); c.fillStyle = '#f0b52c'; c.fillText('◀ birra', 170, 132);
  }

  // joystick a T + dito
  if (t >= 0.5 && t < 8.4){
    const ax = 285, ay = 70, rx = 95, ry = 45, kx = ax + S.rx*rx, ky = ay + S.ry*ry, W2 = 9;
    c.fillStyle = 'rgba(16,23,43,.78)'; c.strokeStyle = 'rgba(255,255,255,.65)'; c.lineWidth = 2;
    rr2(ax - W2, ay - W2, rx + 2*W2, 2*W2, W2); c.fill(); c.stroke();
    if (kx - ax > 1){ c.fillStyle = '#ffd54a'; rr2(ax - W2 + 3, ay - W2 + 3, kx - ax + 2*W2 - 6, 2*W2 - 6, W2 - 3); c.fill(); }
    c.fillStyle = 'rgba(16,23,43,.78)'; rr2(kx - W2, ay - W2, 2*W2, ry + 2*W2, W2); c.fill(); c.stroke();
    if (ky - ay > 1){ c.fillStyle = '#3d9be9'; rr2(kx - W2 + 3, ay - W2 + 3, 2*W2 - 6, ky - ay + 2*W2 - 6, W2 - 3); c.fill(); }
    c.fillStyle = 'rgba(255,255,255,.28)'; c.beginPath(); c.arc(kx, ky, 26 + 3*Math.sin(t*8), 0, 7); c.fill();        // dito
    c.fillStyle = '#ffd54a'; c.beginPath(); c.arc(kx, ky, 15, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke();
    c.font = '800 10px system-ui,sans-serif'; c.fillStyle = '#cfd8f5'; c.textAlign = 'right'; c.fillText('inclina ▶', ax + rx, ay - 16);
    c.textAlign = 'center'; c.fillText('flusso ▼', kx, ay + ry + 24);
  }
  // slide di servizio: il dito trascina il boccale verso destra, piano
  if (t >= 8.4 && t < 11.6){
    const fx = 120 + slideT + 52, fy = 118;
    c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.arc(fx, fy, 24 + 3*Math.sin(t*8), 0, 7); c.fill();
    c.fillStyle = '#ffd54a'; c.beginPath(); c.arc(fx, fy, 13, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke();
    c.fillStyle = '#3ddc97'; c.font = '800 20px system-ui,sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
    if (t < 11.0) c.fillText('▶▶', fx + 34 + 6*Math.sin(t*6), fy);
    else { c.fillStyle = '#ffd54a'; c.fillText('★★★  +10', 300, 120); }
  }
  // didascalia
  const cap = t < 1.0 ? '1. Appoggia il dito sul joystick' : t < 5.3 ? '2. Destra = inclina · Giù = flusso' : t < 8.2 ? '3. Birra fino al tratteggio, poi raddrizza' : '4. Trascina il boccale a destra per servire';
  c.font = '800 14px system-ui,sans-serif'; const tw = c.measureText(cap).width + 28;
  c.fillStyle = 'rgba(16,23,43,.85)'; rr2(W/2 - tw/2, H - 40, tw, 28, 14); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(cap, W/2, H - 26);
  // dissolvenza a inizio/fine ciclo
  const fade = t < 0.35 ? 1 - t/0.35 : t > 11.6 ? (t - 11.6)/0.4 : 0;
  if (fade > 0){ c.fillStyle = `rgba(34,48,79,${fade})`; c.fillRect(0, 0, W, H); }
  c.restore();
}
/* ============================ LOOP ============================ */
function frame(t){
  const dt = last === null ? 0 : Math.min(0.05, (t - last)/1000); last = t;
  time += dt;
  update(dt);
  draw();
  const tutC = document.getElementById('tuto'); if (tutC) drawTutorial(tutC);      // video tutorial nel popup iniziale
  requestAnimationFrame(frame);
}
const wrap = document.getElementById('wrap'), ctlEl = document.getElementById('ctl'), pauseBtn = document.getElementById('pause');
function applyLayout(){
  const port = window.innerHeight > window.innerWidth * 1.1;
  LAND = !port; FULL = port; CW = port ? 480 : 960;
  document.body.classList.toggle('portrait', port);
  document.body.classList.toggle('full', FULL);
  if (FULL) wrap.append(pauseBtn); else ctlEl.append(pauseBtn);                          // telefono: pausa in alto a destra; PC: riga sotto la scena
  if (FULL){                                                                              // la scena occupa tutta l'altezza dello schermo
    CH = clamp(Math.round(CW * wrap.clientHeight / Math.max(1, wrap.clientWidth)), 730, 1100);
    // il mondo parte dal bordo alto dello schermo (come su desktop): la spillatrice si vede intera, la parte alta passa dietro ai pannelli di clienti, vite e monete
    PZ = clamp((CH - JZ_H - 45) / 500, 0.85, 1.5);          // la vaschetta (y 500) sta appena sopra il joystick
    PX0 = 480 - 0.30 * (CW / PZ);                           // il boccale a riposo sta a circa il 30% da sinistra
    PY0 = PSY / PZ;                                         // y mondo 0 = bordo alto del canvas
  } else { CH = 600; PZ = 1.25; PX0 = 365; PY0 = 112; }
  VIS_R = port ? PX0 + CW / PZ - 4 : 742;
  for (const k in GLASSES) GLASSES[k].maxT = maxTiltFor(GLASSES[k]);
  resize();
  const k = Math.min(wrap.clientWidth / CW, wrap.clientHeight / CH);
  cv.style.width = Math.floor(CW*k) + 'px'; cv.style.height = Math.floor(CH*k) + 'px';
  if (FULL){
    const kk = cv.offsetWidth / CW;                  // pausa all'estremità destra della striscia in alto
    pauseBtn.style.left = (cv.offsetLeft + 452*kk - 22) + 'px'; pauseBtn.style.top = (cv.offsetTop + 156*kk - 18) + 'px';
  } else pauseBtn.style.left = pauseBtn.style.top = '';
}
window.addEventListener('resize', applyLayout);
window.addEventListener('orientationchange', () => setTimeout(applyLayout, 150));
applyLayout();
showOverlay('🍺 Spilla la Birra', `
  <canvas id="tuto" width="440" height="250"></canvas>
  <p>Servi i clienti in ordine di arrivo, con la schiuma che chiedono.</p>
  <p class="muted">Istruzioni complete nel menu di pausa ⏸</p>`, 'Inizia', newGame);
mode = 'menu';
requestAnimationFrame(frame);
</script>
