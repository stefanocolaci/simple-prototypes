<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e0a0"/><stop offset=".35" stop-color="#c9a24a"/>
      <stop offset=".6" stop-color="#8f6a22"/><stop offset=".85" stop-color="#e6cc84"/><stop offset="1" stop-color="#b48a38"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c778"/><stop offset="1" stop-color="#c49a45"/>
    </linearGradient>
    <path id="arcTop" d="M 38 128 A 90 90 0 0 1 218 128"/>
    <path id="arcBot" d="M 36 128 A 92 92 0 0 0 220 128"/>
  </defs>
  <circle cx="128" cy="128" r="126" fill="url(#gold)"/>
  <circle cx="128" cy="128" r="118" fill="#fff"/>
  <circle cx="128" cy="128" r="115" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="128" cy="128" r="112" fill="#fff"/>
  <!-- disco dorato dietro al nome -->
  <circle cx="128" cy="136" r="64" fill="url(#disc)"/>
  <!-- scritte ad arco -->
  <text font-family="Georgia,'DejaVu Serif',serif" font-weight="700" font-size="14" letter-spacing="3" fill="#1a1a1a">
    <textPath href="#arcTop" startOffset="3%">SEIT</textPath>
  </text>
  <text font-family="Georgia,'DejaVu Serif',serif" font-weight="700" font-size="14" letter-spacing="3" fill="#1a1a1a" text-anchor="end">
    <textPath href="#arcTop" startOffset="97%">1753</textPath>
  </text>
  <text font-family="Georgia,'DejaVu Serif',serif" font-weight="700" font-size="13" letter-spacing="3.2" fill="#1a1a1a" text-anchor="middle">
    <textPath href="#arcBot" startOffset="50%">DAS EINZIG GUTE</textPath>
  </text>
  <!-- corona -->
  <g transform="translate(128 54) scale(1.2)">
    <path d="M-34 14 L-38 -8 L-24 2 L-16 -14 L-6 0 L0 -20 L6 0 L16 -14 L24 2 L38 -8 L34 14 Z" fill="url(#gold)" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="-35" y="14" width="70" height="7" rx="3" fill="url(#gold)" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="0" cy="-24" r="3.2" fill="url(#gold)" stroke="#1a1a1a" stroke-width="1.6"/>
    <circle cx="-38" cy="-10" r="2.6" fill="url(#gold)" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="38" cy="-10" r="2.6" fill="url(#gold)" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="-16" cy="-16" r="2.4" fill="url(#gold)" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="16" cy="-16" r="2.4" fill="url(#gold)" stroke="#1a1a1a" stroke-width="1.5"/>
  </g>
  <!-- nome, stile gotico pesante con ombra -->
  <g font-family="'DejaVu Serif',Georgia,serif" font-weight="900" text-anchor="middle" font-size="42">
    <text x="130.5" y="152.5" fill="#b8892f" stroke="#b8892f" stroke-width="2" textLength="184" lengthAdjust="spacingAndGlyphs">Kronstein</text>
    <text x="128" y="150" fill="#111" stroke="#111" stroke-width="2.4" stroke-linejoin="round" textLength="184" lengthAdjust="spacingAndGlyphs">Kronstein</text>
  </g>
</svg>
